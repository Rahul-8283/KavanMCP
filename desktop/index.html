<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kavan_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kavan</title>
    <!-- Inject theme synchronously before React boots to prevent white flash (Section 5.1 & Criteria 5) -->
    <script>
      if (localStorage.getItem('theme') !== 'light') {
        document.documentElement.classList.add('dark');
      }
    </script>
    <!-- Paints the theme's ground before the stylesheet arrives. Keep in step with --canvas in index.css. -->
    <style>
      html { background-color: #eae3d7; }
      html.dark { background-color: #0c0a0a; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
