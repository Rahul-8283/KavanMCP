<!doctype html>
<!--
  Template for public/og.png, the 1200x630 sharing image (Open Graph and Twitter card).
  Render it once at a 1200x630 viewport in any Chromium browser and save the screenshot as public/og.png.
  It uses the real dashboard capture in shots-src/, so re-render it when that capture changes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kavan sharing image</title>
    <!-- Only this image-making step reads Google Fonts. The website itself self-hosts the same two faces. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0c0a0a;
        color: #f2ebe7;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      h1 em { font-style: italic; color: #f2505f; }
      .glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(520px 360px at 78% 70%, rgba(168, 20, 34, 0.42), transparent 70%),
          radial-gradient(760px 300px at 8% -6%, rgba(168, 20, 34, 0.2), transparent 70%);
      }
      .brand { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 16px; font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1; letter-spacing: -0.01em; }
      .brand img { width: 56px; height: 56px; }
      h1 { position: absolute; left: 72px; top: 168px; width: 560px; font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: 76px; line-height: 1.06; letter-spacing: -0.015em; }
      p { position: absolute; left: 72px; bottom: 64px; font-size: 22px; color: #aba29e; }
      .shot {
        position: absolute; left: 640px; top: 130px; width: 760px;
        border: 1px solid rgba(255, 236, 228, 0.17); border-radius: 16px; overflow: hidden;
        box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.85);
      }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand"><img src="../public/kavan-mark.svg" alt="" />Kavan</div>
    <h1>Find what's slowing your PC, and end it <em>safely.</em></h1>
    <p>For Windows 10 and 11 · Runs entirely on your PC</p>
    <div class="shot"><img src="../shots-src/dashboard-dark.png" alt="" /></div>
  </body>
</html>
