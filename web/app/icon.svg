<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>

    <radialGradient id="bg" cx="42%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#1E0808"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>

    <linearGradient id="k" x1="50" y1="40" x2="152" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F42032"/>
      <stop offset="55%"  stop-color="#CC1020"/>
      <stop offset="100%" stop-color="#8A0C1A"/>
    </linearGradient>

    <!-- soft halo behind the outer ring -->
    <filter id="halo" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <!-- ── black badge ─────────────────────────────────────────── -->
  <circle cx="100" cy="100" r="97" fill="url(#bg)"/>

  <!-- outer crimson ring with glow -->
  <circle cx="100" cy="100" r="93.5" fill="none"
          stroke="#CC1020" stroke-width="2" filter="url(#halo)"/>

  <!-- subtle inner depth ring -->
  <circle cx="100" cy="100" r="83" fill="none"
          stroke="#5A0C0C" stroke-width="1.5" opacity="0.55"/>

  <!-- ── K letterform ────────────────────────────────────────── -->
  <!--
    Single closed path. Traced clockwise:
      down left side of vertical bar
      up through the two arms (parallelograms, 16 px thick each)
      the V-notch apex sits at the right edge of the bar (x=72, y=100)
  -->
  <path fill="url(#k)" d="
    M  50,40
    L  72,40
    L  72,84
    L 152,40
    L 152,56
    L  72,100
    L 152,144
    L 152,160
    L  72,116
    L  72,160
    L  50,160
    Z"/>

</svg>
